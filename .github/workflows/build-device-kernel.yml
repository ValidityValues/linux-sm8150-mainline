name: Build SM8150 device-support kernel
on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: SM8150 kernel tag, branch, or commit
        required: true
        default: v6.17.0-sm8150
  push:
    paths:
      - '.github/workflows/build-device-kernel.yml'
      - 'README.md'
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: device-kernel
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SRC: https://gitlab.postmarketos.org/soc/qualcomm-sm8150/linux.git
      REF: ${{ inputs.kernel_ref || 'v6.17.0-sm8150' }}
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev lz4 pahole python3 rsync zstd
      - name: Fetch source
        run: |
          git clone --filter=blob:none --no-checkout "$SRC" kernel
          git -C kernel fetch --force --tags origin
          git -C kernel checkout --detach "$REF"
          # Compatibility fix: downstream idtp9418 uses descriptor GPIO APIs but
          # omits the header that declares them in this source revision.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/drivers/power/supply/idtp9418.c")
          if p.exists():
              s = p.read_text()
              header = "#include <linux/gpio/consumer.h>"
              if header not in s:
                  lines = s.splitlines()
                  index = next((i for i, line in enumerate(lines) if line.startswith("#include ")), None)
                  if index is None:
                      raise SystemExit("Cannot safely patch idtp9418.c: include block not found")
                  lines.insert(index, header)
                  p.write_text("\\n".join(lines) + "\\n")
                  print("Applied missing gpio consumer header")
          PY
          git -C kernel diff -- drivers/power/supply/idtp9418.c > idtp9418-gpio-header.patch
          git -C kernel log -1 --format='source_commit=%H%nsubject=%s' | tee source.txt
          test -f kernel/arch/arm64/configs/sm8150.config
      - name: Build kernel, modules and DTBs
        run: |
          set -euxo pipefail
          cd kernel
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out sm8150.config
          scripts/config --file out/.config --enable EFI --enable EFI_STUB --enable EXT4_FS --enable DEVTMPFS --enable DEVTMPFS_MOUNT --enable BLK_DEV_INITRD
          # Best-effort enablement for WCN399x/ath10k Wi-Fi, QCA UART Bluetooth, QRTR and compressed firmware.
          scripts/config --file out/.config --enable CFG80211 --enable MAC80211 --module ATH10K --module ATH10K_SNOC --enable BT --module BT_HCIUART --module BT_HCIUART_QCA --module QRTR --module QRTR_SMD --module QCOM_QMI_HELPERS --enable FW_LOADER_COMPRESS --enable FW_LOADER_COMPRESS_ZSTD --enable FW_LOADER_COMPRESS_XZ
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out olddefconfig
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out Image modules dtbs
          DTB="$(find out/arch/arm64/boot/dts -type f -name sm8150-google-flame.dtb -print -quit)"
          test -s out/arch/arm64/boot/Image
          test -n "$DTB" && test -s "$DTB"
          REL="$(make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out -s kernelrelease)"
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/stage/Image"
          cp "$DTB" "$GITHUB_WORKSPACE/stage/sm8150-google-flame.dtb"
          cp out/.config "$GITHUB_WORKSPACE/stage/config"
          cp out/System.map "$GITHUB_WORKSPACE/stage/System.map"
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out INSTALL_MOD_PATH="$GITHUB_WORKSPACE/stage/modules" modules_install
          tar --zstd -cf "$GITHUB_WORKSPACE/stage/modules.tar.zst" -C "$GITHUB_WORKSPACE/stage/modules" lib/modules
          grep -E '^CONFIG_(CFG80211|MAC80211|ATH10K|ATH10K_SNOC|BT=|BT_HCIUART|BT_HCIUART_QCA|QRTR|QRTR_SMD|QCOM_QMI_HELPERS|FW_LOADER_COMPRESS)' out/.config > "$GITHUB_WORKSPACE/stage/wifi-bluetooth-kernel-config.txt" || true
          printf 'ref=%s\nkernelrelease=%s\n' "$REF" "$REL" > "$GITHUB_WORKSPACE/stage/MANIFEST.txt"
          cat "$GITHUB_WORKSPACE/source.txt" >> "$GITHUB_WORKSPACE/stage/MANIFEST.txt"
          printf 'compatibility_patch=idtp9418 missing GPIO consumer include if required; see idtp9418-gpio-header.patch\n' >> "$GITHUB_WORKSPACE/stage/MANIFEST.txt"
          cp "$GITHUB_WORKSPACE/idtp9418-gpio-header.patch" "$GITHUB_WORKSPACE/stage/"
          printf 'wifi_bluetooth=kernel options enabled where supported; see wifi-bluetooth-kernel-config.txt\n' >> "$GITHUB_WORKSPACE/stage/MANIFEST.txt"
          printf 'device_validation=not yet performed on physical google-flame\n' >> "$GITHUB_WORKSPACE/stage/MANIFEST.txt"
          cd "$GITHUB_WORKSPACE/stage"
          sha256sum Image sm8150-google-flame.dtb config System.map modules.tar.zst wifi-bluetooth-kernel-config.txt idtp9418-gpio-header.patch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flame-kernel-device-support-${{ github.run_number }}
          path: stage/
          if-no-files-found: error
          retention-days: 30
